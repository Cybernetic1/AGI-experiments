<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1300" width="1060" height="1300">
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker>
<marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#1565C0"/></marker>
<marker id="a-pur" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#6A1B9A"/></marker>
<marker id="a-ora" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#E65100"/></marker>
<marker id="a-grn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2E7D32"/></marker>
<marker id="a-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#B71C1C"/></marker>
</defs>
<rect x="0" y="0" width="1060" height="1300" fill="#ffffff" stroke="none" stroke-width="1.5" rx="0" />
<text x="530" y="28" font-size="18" text-anchor="middle" fill="#222" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Logic Transformer v2.1 — String Diagram (Up+Down Model)</text>
<rect x="772" y="24" width="260" height="155" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="6" />
<text x="898" y="40" font-size="13" text-anchor="middle" fill="#444" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Legend</text>
<line x1="780" y1="58" x2="815" y2="58" stroke="#1565C0" stroke-width="3"  />
<text x="820" y="62" font-size="11" text-anchor="start" fill="#333" style="font-style:normal;font-weight:normal;font-family:sans-serif;">Working Memory wire  (batch,W,L)</text>
<line x1="780" y1="82" x2="815" y2="82" stroke="#6A1B9A" stroke-width="3"  />
<text x="820" y="86" font-size="11" text-anchor="start" fill="#333" style="font-style:normal;font-weight:normal;font-family:sans-serif;">Selected proposition  sel_j  (batch,L)</text>
<line x1="780" y1="106" x2="815" y2="106" stroke="#E65100" stroke-width="3"  />
<text x="820" y="110" font-size="11" text-anchor="start" fill="#333" style="font-style:normal;font-weight:normal;font-family:sans-serif;">Binding / parameter wire</text>
<line x1="780" y1="130" x2="815" y2="130" stroke="#2E7D32" stroke-width="3"  />
<text x="820" y="134" font-size="11" text-anchor="start" fill="#333" style="font-style:normal;font-weight:normal;font-family:sans-serif;">Variable-slot wire  (batch,I)</text>
<line x1="780" y1="154" x2="815" y2="154" stroke="#B71C1C" stroke-width="3"  />
<text x="820" y="158" font-size="11" text-anchor="start" fill="#333" style="font-style:normal;font-weight:normal;font-family:sans-serif;">Output / conclusion  (batch,O)</text>
<rect x="275" y="130" width="410" height="870" fill="#f3e5f5" stroke="#7B1FA2" stroke-width="2" rx="16" style="fill-opacity:0.25" stroke-dasharray="7,4"/>
<text x="281" y="152" font-size="12" text-anchor="start" fill="#7B1FA2" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Rule  m  (m = 1 … M)</text>
<rect x="255" y="40" width="450" height="60" fill="#E3F2FD" stroke="#1565C0" stroke-width="2" rx="10" />
<text x="480" y="62" font-size="14" text-anchor="middle" fill="#1565C0" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Working Memory  WM</text>
<text x="480" y="82" font-size="11" text-anchor="middle" fill="#1565C0" style="font-style:italic;font-weight:normal;font-family:sans-serif;">shape:  (batch, W, L)</text>
<line x1="480" y1="100" x2="480" y2="160" stroke="#1565C0" stroke-width="3"  marker-end="url(#a-blue)"/>
<path d="M 480 100 L 480 110 L 290 110 L 290 450 L 335 450" stroke="#1565C0" fill="none" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#a-blue)"/>
<text x="268" y="290" font-size="11" text-anchor="middle" fill="#1565C0" style="font-style:italic;font-weight:normal;font-family:sans-serif;">WM</text>
<rect x="335" y="160" width="290" height="70" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="1.5" rx="8" />
<text x="480" y="180" font-size="13" text-anchor="middle" fill="#4A148C" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Cylindrification Match  j = 1</text>
<text x="480" y="198" font-size="10" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">score[w] = Σ_l (1−γ[1,l])·(c[1,l]−wm[w,l])²</text>
<text x="480" y="212" font-size="10" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">attn[1] = softmax(−score/T)   ;   sel₁ = Σ_w attn[1,w]·wm[w]</text>
<rect x="633" y="162" width="190" height="28" fill="#FFF3E0" stroke="#E65100" stroke-width="1" rx="4" />
<text x="728" y="180" font-size="10" text-anchor="middle" fill="#E65100" style="font-style:normal;font-weight:normal;font-family:sans-serif;">constants[1,:]  γs[1,:]</text>
<line x1="633" y1="176" x2="625" y2="190" stroke="#E65100" stroke-width="1.5"  marker-end="url(#a-ora)"/>
<line x1="480" y1="230" x2="480" y2="340" stroke="#6A1B9A" stroke-width="3"  marker-end="url(#a-pur)"/>
<text x="498" y="246" font-size="11" text-anchor="start" fill="#6A1B9A" style="font-style:italic;font-weight:normal;font-family:sans-serif;">sel₁  (batch, L)</text>
<rect x="380" y="340" width="200" height="50" fill="#FFF8E1" stroke="#E65100" stroke-width="1.5" rx="8" />
<text x="480" y="358" font-size="12" text-anchor="middle" fill="#E65100" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Binding Constraint</text>
<text x="480" y="376" font-size="10" text-anchor="middle" fill="#777" style="font-style:italic;font-weight:normal;font-family:sans-serif;">score += gate·|B[i,k]|·(sel₁[i]−wm[w,k])²</text>
<rect x="588" y="342" width="160" height="24" fill="#FFF3E0" stroke="#E65100" stroke-width="1" rx="4" />
<text x="668" y="356" font-size="10" text-anchor="middle" fill="#E65100" style="font-style:normal;font-weight:normal;font-family:sans-serif;">B[j−1] ∈ ℝ^{L×L},  gate</text>
<line x1="588" y1="354" x2="580" y2="365" stroke="#E65100" stroke-width="1.5"  marker-end="url(#a-ora)"/>
<line x1="480" y1="390" x2="480" y2="420" stroke="#6A1B9A" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#a-pur)"/>
<rect x="335" y="420" width="290" height="70" fill="#EDE7F6" stroke="#7B1FA2" stroke-width="1.5" rx="8" />
<text x="480" y="440" font-size="13" text-anchor="middle" fill="#4A148C" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Cylindrification Match  j = 2</text>
<text x="480" y="458" font-size="10" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">score[w] = Σ_l (1−γ[2,l])·(c[2,l]−wm[w,l])²  + binding</text>
<text x="480" y="472" font-size="10" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">attn[2] = softmax(−score/T)   ;   sel₂ = Σ_w attn[2,w]·wm[w]</text>
<rect x="633" y="422" width="190" height="28" fill="#FFF3E0" stroke="#E65100" stroke-width="1" rx="4" />
<text x="728" y="440" font-size="10" text-anchor="middle" fill="#E65100" style="font-style:normal;font-weight:normal;font-family:sans-serif;">constants[2,:]  γs[2,:]</text>
<line x1="633" y1="436" x2="625" y2="450" stroke="#E65100" stroke-width="1.5"  marker-end="url(#a-ora)"/>
<line x1="480" y1="490" x2="480" y2="590" stroke="#6A1B9A" stroke-width="3"  marker-end="url(#a-pur)"/>
<text x="498" y="506" font-size="11" text-anchor="start" fill="#6A1B9A" style="font-style:italic;font-weight:normal;font-family:sans-serif;">sel₂  (batch, L)</text>
<rect x="335" y="590" width="290" height="60" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1.5" rx="8" />
<text x="480" y="612" font-size="13" text-anchor="middle" fill="#6A1B9A" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Concatenate  [sel₁ ‖ sel₂]</text>
<text x="480" y="632" font-size="11" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">shape:  (batch, J·L)</text>
<line x1="480" y1="650" x2="480" y2="700" stroke="#2E7D32" stroke-width="3"  marker-end="url(#a-grn)"/>
<text x="498" y="666" font-size="11" text-anchor="start" fill="#2E7D32" style="font-style:italic;font-weight:normal;font-family:sans-serif;">(batch, J·L)</text>
<rect x="335" y="700" width="290" height="60" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" rx="8" />
<text x="480" y="722" font-size="13" text-anchor="middle" fill="#1B5E20" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Up  :  Linear( J·L  →  I )</text>
<text x="480" y="742" font-size="11" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">captured_vars = up( concat )     shape: (batch, I)</text>
<line x1="480" y1="760" x2="480" y2="800" stroke="#2E7D32" stroke-width="3"  marker-end="url(#a-grn)"/>
<text x="498" y="774" font-size="11" text-anchor="start" fill="#2E7D32" style="font-style:italic;font-weight:normal;font-family:sans-serif;">captured_vars  (batch, I)</text>
<rect x="335" y="800" width="290" height="60" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" rx="8" />
<text x="480" y="822" font-size="13" text-anchor="middle" fill="#1B5E20" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Down  :  Linear( I  →  output_dim )</text>
<text x="480" y="842" font-size="11" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">output = down( captured_vars )     shape: (batch, O)</text>
<line x1="480" y1="860" x2="480" y2="900" stroke="#B71C1C" stroke-width="3"  marker-end="url(#a-red)"/>
<text x="498" y="874" font-size="11" text-anchor="start" fill="#B71C1C" style="font-style:italic;font-weight:normal;font-family:sans-serif;">output  (batch, O)</text>
<rect x="335" y="900" width="290" height="60" fill="#FFEBEE" stroke="#B71C1C" stroke-width="1.5" rx="8" />
<text x="480" y="922" font-size="13" text-anchor="middle" fill="#B71C1C" style="font-style:normal;font-weight:bold;font-family:sans-serif;">× confidence</text>
<text x="480" y="942" font-size="11" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">confidence = exp(−Σ_j match_quality_j)</text>
<line x1="480" y1="960" x2="480" y2="1010" stroke="#B71C1C" stroke-width="3"  marker-end="url(#a-red)"/>
<text x="498" y="974" font-size="11" text-anchor="start" fill="#B71C1C" style="font-style:italic;font-weight:normal;font-family:sans-serif;">rule_output  (batch, O)</text>
<rect x="335" y="1010" width="290" height="60" fill="#FCE4EC" stroke="#B71C1C" stroke-width="2" rx="8" />
<text x="480" y="1032" font-size="14" text-anchor="middle" fill="#B71C1C" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Σ  over  M  rules</text>
<text x="480" y="1052" font-size="11" text-anchor="middle" fill="#555" style="font-style:italic;font-weight:normal;font-family:sans-serif;">total_output = Σ_m rule_output_m</text>
<line x1="480" y1="1070" x2="480" y2="1130" stroke="#B71C1C" stroke-width="3"  marker-end="url(#a-red)"/>
<text x="498" y="1084" font-size="11" text-anchor="start" fill="#B71C1C" style="font-style:italic;font-weight:normal;font-family:sans-serif;">total_output  (batch, O)</text>
<rect x="315" y="1130" width="330" height="50" fill="#FFCDD2" stroke="#B71C1C" stroke-width="2" rx="10" />
<text x="480" y="1150" font-size="14" text-anchor="middle" fill="#B71C1C" style="font-style:normal;font-weight:bold;font-family:sans-serif;">OUTPUT</text>
<text x="480" y="1168" font-size="11" text-anchor="middle" fill="#B71C1C" style="font-style:italic;font-weight:normal;font-family:sans-serif;">Predicted conclusion  (batch, output_dim)</text>
<rect x="750" y="160" width="290" height="380" fill="#FAFAFA" stroke="#AAA" stroke-width="1" rx="8" />
<text x="895" y="180" font-size="13" text-anchor="middle" fill="#333" style="font-style:normal;font-weight:bold;font-family:sans-serif;">Learned Parameters</text>
<rect x="756" y="198" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="214" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">constants  (J, L)</text>
<text x="764" y="226" font-size="9" text-anchor="start" fill="#777" style="font-style:italic;font-weight:normal;font-family:sans-serif;">template values for matching</text>
<rect x="756" y="236" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="252" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">γs  (J, L)</text>
<text x="764" y="264" font-size="9" text-anchor="start" fill="#777" style="font-style:italic;font-weight:normal;font-family:sans-serif;">cylindrification  [0=const, 1=var]</text>
<rect x="756" y="274" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="290" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">B[j-1]  (L, L)</text>
<text x="764" y="302" font-size="9" text-anchor="start" fill="#777" style="font-style:italic;font-weight:normal;font-family:sans-serif;">binding matrix  (J−1 of these)</text>
<rect x="756" y="312" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="328" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">gate[j-1]  scalar</text>
<text x="764" y="340" font-size="9" text-anchor="start" fill="#777" style="font-style:italic;font-weight:normal;font-family:sans-serif;">binding gate  (sigmoid)</text>
<rect x="756" y="350" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="366" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">Up.weight  (I, J·L)</text>
<text x="764" y="378" font-size="9" text-anchor="start" fill="#777" style="font-style:italic;font-weight:normal;font-family:sans-serif;">maps premises → variable slots</text>
<rect x="756" y="388" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="404" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">Up.bias  (I,)</text>
<rect x="756" y="426" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="442" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">Down.weight  (O, I)</text>
<text x="764" y="454" font-size="9" text-anchor="start" fill="#777" style="font-style:italic;font-weight:normal;font-family:sans-serif;">maps vars → conclusion</text>
<rect x="756" y="464" width="278" height="30" fill="#F0F0F0" stroke="#ccc" stroke-width="1" rx="4" />
<text x="764" y="480" font-size="11" text-anchor="start" fill="#1B5E20" style="font-style:normal;font-weight:normal;font-family:monospace;">Down.bias  (O,)</text>
</svg>
